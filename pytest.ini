[pytest]
# Tests live in tests/; run them from the project root with: pytest
testpaths = tests

# Lets tests import project code as "from src.tools.math_engine import ..."
pythonpath = .

# Tests that call a real LLM or Neo4j database are marked @pytest.mark.integration.
# They cost money / need a running database, so they are skipped by default.
# Run them on purpose with: pytest -m integration
markers =
    integration: calls a real LLM or Neo4j database (skipped by default)
addopts = -m "not integration"

# Hide deprecation warnings raised inside CrewAI's own code (not fixable in this project)
filterwarnings =
    ignore::DeprecationWarning:crewai.*
